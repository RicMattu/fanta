name: aggiorna-formazione

on:
  workflow_dispatch: {}          # gira SOLO quando premi tu "Run workflow"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa dipendenze
        run: pip install -r requirements.txt
      - name: Calcola formazione
        run: python build_dati.py
      - name: Pubblica dati.json
        run: |
          git config user.name "fanta-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dati.json
          git commit -m "aggiorna formazione" || echo "nessuna modifica"
          git push
