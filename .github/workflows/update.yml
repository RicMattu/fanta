name: aggiorna-formazione

# Quando gira: a orari fissi (UTC) nei giorni di campionato, piu' avvio manuale.
# Gli orari sono in UTC: 07,10,13,16 UTC = 09,12,15,18 ora italiana (estate).
on:
  # schedule:
  #  - cron: "0 7,10,13,16 * * 4,5,6,0"   # gio, ven, sab, dom
  workflow_dispatch: {}                    # bottone "Run" manuale

permissions:
  contents: write     # serve per ricommittare web/dati.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Calcola formazione
        run: python build_dati.py

      - name: Pubblica dati.json
        run: |
          git config user.name "fanta-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dati.json
          git commit -m "aggiorna formazione" || echo "nessuna modifica"
          git push
